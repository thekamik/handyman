{% extends "base.html" %}

{% block title %}Logowanie{% endblock %}

{% block content %}
  <h1>Logowanie</h1>

  {# method="post": fields go in the request body, not in the URL.
     The `name` of each input becomes the field name the server reads. #}
  <form action="/login" method="post">
    <label>
      Login
      <input type="text" name="username" required>
    </label>
    <label>
      Hasło
      <input type="password" name="password" required>
    </label>
    <button type="submit">Zaloguj</button>
  </form>
{% endblock %}

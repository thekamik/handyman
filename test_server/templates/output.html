{% extends "base.html" %}

{% block title %}Wynik{% endblock %}

{% block content %}
  <h1>Co dotarło do serwera</h1>

  {# {{ value }} is HTML-escaped by Jinja2, so input like <script> is shown as text, not run #}
  <table>
    <tr><th>Login</th><td>{{ username }}</td></tr>
    <tr><th>Hasło</th><td>{{ password }}</td></tr>
  </table>

  <h2>Nagłówki żądania</h2>
  <p>Porównaj je z tym, co pokazuje proxy.</p>
  <table>
    {% for name, value in headers.items() %}
      <tr><th>{{ name }}</th><td>{{ value }}</td></tr>
    {% endfor %}
  </table>

  <p><a href="/login">Wróć do formularza</a></p>
{% endblock %}
